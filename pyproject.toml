[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab"
version = "1.4.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "prettytable",
  "tqdm",
  "tyro>=1.0.1",
  # From PyPI, whose Linux wheel is the CUDA 12.8 build: `uv sync` and every
  # `uv run` resolve the same torch, so nothing swaps it between commands.
  "torch>=2.7.0",
  "torchrunx>=0.3.4",
  "warp-lang>=1.12.0",
  "mujoco-warp>=3.8.0.2,~=3.8.0",
  "mujoco~=3.8.0",
  "trimesh>=4.8.3",
  "scipy>=1.15",
  "viser>=1.0.27",
  "mjviser>=0.0.14",
  "mediapy>=1.2.6",
  "imageio-ffmpeg",
  "tensordict",
  "rsl-rl-lib==5.4.0",
  "tensorboard>=2.20.0",
  "onnxscript>=0.5.4",
  "wandb>=0.22.3",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
demo = "mjlab.scripts.demo:main"
list-envs = "mjlab.scripts.list_envs:main"
viz-nan = "mjlab.scripts.nan_viz:main"
export-scene = "mjlab.scripts.export_scene:main"

[dependency-groups]
dev = [
  "ipdb>=0.13.13",
  "pre-commit>=4.3.0",
  "pyright>=1.1.408",
  "onnxruntime>=1.19.0; python_version >= '3.11'",
  "pytest>=v9.0.3",
  "ruff>=v0.14.14",
  "ty>=v0.0.14",
]
codancing = [
  "hydra-core",
  "hydra-zen>=0.13.0",
  "matplotlib>=3.10.8",
  "mink>=1.0.0",
  "omegaconf>=2.3.0",
  "pyvicon-datastream>=0.2.4",
]
docs = [
  "myst-parser>=4.0.1",
  "sphinx>=8.1.3",
  "sphinx-autodoc-typehints>=3.0.1",
  "sphinx-autobuild>=2024.10.3",
  "sphinx-book-theme>=1.1.4",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "autodocsumm",
  "sphinxemoji",
  "sphinxcontrib.bibtex",
  "sphinx-icon",
  "sphinx-tabs",
  "sphinx_multiversion",
]

[project.optional-dependencies]
# The G1 deploy host's comms binding (nanobind, abi3). Builds from source
# (C++17 toolchain + the unitree_sdk2 submodule, fetched by uv itself), so it
# is an OPT-IN extra on purpose: a dependency-group would be pulled in by
# default-groups = "all" and build a C++ toolchain dependency on every
# training box. Rev-pinned, never a branch, so
# a lock refresh cannot silently rebuild a different binding.
deploy = [
  "unitree-sdk2-bind @ git+https://github.com/zhuoqun-chen/unitree-sdk2-nanobind@91684e3ed3a3313cf977ae13f333670309ff8389 ; python_full_version >= '3.12' and sys_platform == 'linux'",
  # Both deploy runners (simple_deploy/stand.py, codance.py) infer from the
  # exported ONNX, so this is a runtime dependency of the deploy host, not a
  # dev tool. The dev group installs it too (default-groups = "all"), but a
  # deploy host syncing --no-dev must still be able to run a policy.
  "onnxruntime>=1.19.0; python_version >= '3.11'",
]

[tool.uv]
# Install all dependency-groups (dev/codancing/docs) by default, so no site needs
# to pass --all-groups.
default-groups = "all"
override-dependencies = ["mujoco==3.8.1"]
constraint-dependencies = [
  "GitPython>=3.1.49",
  "lxml>=6.1.0",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
# Pin mujoco to released PyPI 3.8.1 THROUGH AN OVERRIDE, not just a version
# floor: the git-pinned mujoco_warp's own pyproject routes its mujoco
# requirement through py.mujoco.org (a rolling nightly window that carries no
# 3.8.x wheel), uv honors a git dependency's index routing, and
# two different routes for one package are a hard resolver conflict. The
# override replaces that requirement (and its routing) entirely; the source
# line routes the surviving requirement to PyPI.
mujoco = { index = "pypi" }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "88b55fc2696960b927bc12584994bb8412b36558" }
# The vendored rsl_rl fork (third_party/rsl_rl) adds the AMP modules on top of
# the rsl-rl-lib 5.4.0 base (it declares version 5.4.0, satisfying the
# `rsl-rl-lib==5.4.0` pin above). Editable, so edits there apply in-tree.
rsl-rl-lib = { path = "third_party/rsl_rl", editable = true }

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 2
exclude = [
  "src/mjlab/utils/lab_api",
  "typings",
  "third_party",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# F841 (assigned-but-unused) is allowed: reward and debug code keeps some
# intermediate quantities on purpose.
ignore = ["B011", "F841"]

[tool.ruff.lint.per-file-ignores]
# These entry points must set MUJOCO_GL before any (transitive) mujoco
# import -- the GL backend is frozen at import time.
"src/mjlab/scripts/run.py" = ["E402"]

[tool.pyright]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
# Resolve `import rsl_rl.*` from the vendored editable source.
extraPaths = ["third_party/rsl_rl"]
# Research trees with type debt are scoped out; the mjlab core and the
# codancing task stay type-checked (mirrors the `[tool.ty.src]` exclude).
ignore = [
  "./typings",
  "./third_party",
  "./src/mjlab/utils/lab_api",
  "./docs",
  "./src/mjlab/tasks/shared",
  "./src/mjlab/rl/shared",
  # Single-file SoftMimic offline-augmentation research port with type debt
  # (mujoco viewer-handle None-typing), scoped out like the research trees.
  "./scripts/softmimic_mink_augment.py",
]
stubPath = "typings"

[tool.ty.environment]
# third_party/rsl_rl is the vendored editable rsl_rl source; ty needs the source
# path to resolve `import rsl_rl.*` (editable installs aren't auto-discovered).
# scripts/ holds standalone tools that tests import via a sys.path shim (e.g.
# augment_multilink); ty can't trace the runtime insert, so declare the path here.
extra-paths = ["typings", "third_party/rsl_rl", "scripts"]

[tool.ty.src]
include = ["src", "tests"]
exclude = [
  "src/mjlab/utils/lab_api",
  "typings",
  # Research trees carrying type debt; the mjlab core and the codancing task
  # stay fully type-checked.
  "src/mjlab/tasks/shared",
  "src/mjlab/rl/shared",
]

[tool.pytest.ini_options]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "--strict-markers"
# The repo gate runs the repo's own tests; the vendored rsl_rl carries none.
testpaths = ["tests"]
